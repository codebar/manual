---
layout: default
title: Codebar Docs
---

<div class="content">
  <ul class="post-list">
    {% assign sorted_posts = site.posts | sort: "weight" %}
    {% for post in sorted_posts %}
      <li>
        <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</div>
